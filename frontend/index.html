<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <i class="fa-solid fa-file-contract"></i>
        </div>
        <h1>AI Resume Analyzer</h1>
        <p>Upload or paste your resume and a job description to receive a detailed analysis, including categorized skills and actionable feedback.</p>
    </header>

    <main class="main-container">
        <section class="panel inputs-panel">
            <h2>Your Inputs</h2>
            
            <div class="input-group">
                <h3><i class="fa-solid fa-file-lines"></i> Your Resume</h3>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('resume', 'pdf')">Upload PDF</button>
                    <button class="tab-btn" onclick="switchTab('resume', 'text')">Paste Text</button>
                </div>
                <div id="resume-pdf-section" class="tab-content active">
                    <input type="file" id="resume_pdf" accept=".pdf" class="file-input">
                </div>
                <div id="resume-text-section" class="tab-content">
                    <textarea id="resume_text" rows="4" placeholder="Paste your resume here..."></textarea>
                </div>
            </div>

            <div class="input-group">
                <h3><i class="fa-solid fa-briefcase"></i> Job Description</h3>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('jd', 'pdf')">Upload PDF</button>
                    <button class="tab-btn" onclick="switchTab('jd', 'text')">Paste Text</button>
                </div>
                <div id="jd-pdf-section" class="tab-content active">
                    <input type="file" id="jd_pdf" accept=".pdf" class="file-input">
                </div>
                <div id="jd-text-section" class="tab-content">
                    <textarea id="jd_text" rows="4" placeholder="Paste the job description here..."></textarea>
                </div>
            </div>

            <button id="analyze-btn" class="primary-btn">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Analyze
            </button>
        </section>

        <section class="panel results-panel">
            <h2>Analysis Results</h2>
            <div id="results-container" class="results-content">
                <p class="placeholder-text">Your results will appear here once the analysis is complete.</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
